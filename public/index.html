document.addEventListener('click',e=>{const playBtn=e.target.closest('[data-play]');if(playBtn){play(playBtn.dataset.play,playBtn.dataset.demoPath);return}const route=e.target.closest('[data-route]');if(route){location.hash='/'+route.dataset.route;return}if(e.target.closest('[data-edit-kit]')){editKit(e.target.closest('[data-edit-kit]').dataset.editKit);return}if(e.target.closest('[data-delete-kit]')){deleteKit(e.target.closest('[data-delete-kit]').dataset.deleteKit);return}if(e.target.closest('[data-toggle-kit]')){toggleKit(e.target.closest('[data-toggle-kit]').dataset.toggleKit,e.target.closest('[data-toggle-kit]').dataset.visibility);return}if(e.target.closest('[data-download]')){downloadKit(e.target.closest('[data-download]').dataset.download);return}if(e.target.closest('[data-share]')){navigator.clipboard?.writeText(PRODUCTION_ORIGIN+location.hash);showToast('Production link copied to clipboard');return}if(e.target.closest('[data-like-kit]')){toggleKitLike(e.target.closest('[data-like-kit]').dataset.likeKit,e.target.closest('[data-like-kit]'));return}if(e.target.closest('[data-follow]')){toggleFollow(e.target.closest('[data-follow]').dataset.follow,e.target.closest('[data-follow]'));return}if(e.target.closest('[data-save-profile]')){saveProfile();return}if(e.target.closest('[data-submit]')){publishKit();return}const sort=document.getElementById('producerSort');if(sort&&e.target===sort){const grid=document.querySelector('.producer-grid');[...grid.children].sort((a,b)=>(Number(b.dataset[sort.value])||0)-(Number(a.dataset[sort.value])||0)).forEach(row=>grid.appendChild(row));return}const filter=e.target.closest('[data-filter]');if(filter){document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));filter.classList.add('active');const q=filter.dataset.filter.toLowerCase();document.getElementById('kitGrid').innerHTML=catalogKits.filter(k=>q==='all'||k.genre.toLowerCase().includes(q)|| (q==='free'&&k.price==='FREE') || (q==='paid'&&k.price!=='FREE')). async function toggleKitLike(id,button){if(!currentUser){showToast('Sign in to like kits');return}button.disabled=true;const result=await supabaseClient.rpc('toggle_kit_like',{target_kit_id:id});button.disabled=false;if(result.error){showToast(result.error.message);return}const count=Number(button.querySelector('span').textContent)||0;const liked=result.data;button.classList.toggle('liked',liked);button.querySelector('span').textContent=Math.max(0,count+(liked?1:-1));showToast(liked?'Kit liked':'Like removed')}async function toggleFollow(id,button){if(!currentUser){showToast('Sign in to follow producers');return}if(currentUser.id===id){showToast('You cannot follow yourself');return}button.disabled=true;const existing=await supabaseClient.from('follows').select('follower_id').eq('follower_id',currentUser.id).eq('following_id',id).maybeSingle();const result=existing.data?await supabaseClient.from('follows').delete().eq('follower_id',currentUser.id).eq('following_id',id):await supabaseClient.from('follows').insert({follower_id:currentUser.id,following_id:id});button.disabled=false;if(result.error){showToast(result.error.message);return}button.textContent=existing.data?'Follow':'Following'}async function saveProfile(){if(!currentUser)return;const avatarFile=document.getElementById('profileAvatarFile')?.files?.[0];let avatarUrl=null;if(avatarFile){if(!/^image\/(png|jpe?g|webp)$/.test(avatarFile.type)||avatarFile.size>5*1024*1024){showToast('Avatar must be PNG, JPG, or WebP under 5 MB');return}const path=currentUser.id+'/avatar.'+avatarFile.name.split('.').pop().toLowerCase();const upload=await supabaseClient.storage.from('covers').upload(path,avatarFile,{upsert:true,contentType:avatarFile.type});if(upload.error){showToast(upload.error.message);return}avatarUrl=supabaseClient.storage.from('covers').getPublicUrl(path).data.publicUrl}const payload={id:currentUser.id,username:document.getElementById('profileUsername')?.value.trim().toLowerCase(),display_name:document.getElementById('profileDisplayName')?.value.trim(),avatar_url:avatarUrl||undefined,bio:document.getElementById('profileBio')?.value.trim(),soundcloud_url:document.getElementById('profileSoundcloud')?.value.trim()||null,instagram_url:document.getElementById('profileInstagram')?.value.trim()||null,youtube_url:document.getElementById('profileYoutube')?.value.trim()||null};if(!/^[a-z0-9_]{3,30}$/.test(payload.username||'')){showToast('Username must be 3–30 letters, numbers, or underscores');return}if(!payload.display_name){showToast('Display name is required');return}const {error}=await supabaseClient.from('profiles').upsert(payload,{onConflict:'id'});if(error){showToast(error.code==='23505'?'Username is already taken':error.message);return}showToast('Profile saved')}async function editKit(id){const {data:current,error}=await supabaseClient.from('kits').select('id,title,description,price,genre_tags,visibility,license,cover_art_path,archive_path,archive_size_bytes').eq('id',id).eq('producer_id',currentUser.id).single();const tracksResult=await supabaseClient.from('demo_tracks').select('id,title,audio_path,duration_seconds,sort_order').eq('kit_id',id).order('sort_order');if(error||!current){showToast('Kit could not be loaded');return}let tracks=tracksResult.data||[],removed=[];const esc=value=>String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');const modal=document.createElement('div');modal.className='edit-modal';modal.innerHTML=`<form class="edit-card" id="editKitForm"><h2>Edit soundkit</h2><div class="form-grid"><div class="field full"><label>Kit title</label><input id="editTitle" required value="${esc(current.title)}"></div><div class="field full"><label>Description</label><textarea id="editDescription">${esc(current.description)}</textarea></div><div class="field"><label>Genre</label><input id="editGenre" value="${esc(current.genre_tags?.[0])}"></div><div class="field"><label>Price (USD)</label><input id="editPrice" type="number" min="0" step="1" value="${current.price||0}"></div><div class="field"><label>License</label><select id="editLicense"><option ${current.license==='ROYALTY-FREE'?'selected':''}>ROYALTY-FREE</option><option ${current.license==='ALL RIGHTS RESERVED'?'selected':''}>ALL RIGHTS RESERVED</option><option ${current.license==='CC0'?'selected':''}>CC0</option><option ${current.license==='CUSTOM'?'selected':''}>CUSTOM</option></select></div><div class="field"><label>Visibility</label><select id="editVisibility"><option value="public" ${current.visibility==='public'?'selected':''}>Public</option><option value="private" ${current.visibility==='private'?'selected':''}>Private</option></select></div><div class="field full"><label>Cover artwork</label><input id="editCover" type="file" accept="image/png,image/jpeg,image/webp"><span class="detail-sub">Leave empty to keep the current cover.</span></div><div class="field full"><label>Replace archive</label><input id="editArchive" type="file" accept=".zip,application/zip"><span class="detail-sub">Leave empty to keep the current ZIP.</span></div><div class="field full"><label>Demo tracks</label><div id="editTracks">${tracks.map((track,index)=>`<div class="edit-track" data-track-id="${track.id}"><input class="track-title" value="${esc(track.title)}"><span>${esc(track.audio_path.split('/').pop())}</span><button type="button" class="btn small-btn" data-remove-track="${track.id}">Remove</button></div>`).join('')||'<p class="detail-sub">No demo tracks uploaded.</p>'}</div><input id="editDemos" type="file" accept="audio/mpeg,audio/wav,audio/x-wav" multiple></div></div><div class="edit-actions"><button type="button" class="btn" data-close-edit>Cancel</button><button type="submit" class="btn primary">Save changes</button></div></form>`;document.body.appendChild(modal);modal.querySelector('[data-close-edit]').onclick=()=>modal.remove();modal.addEventListener('click',event=>{const remove=event.target.closest('[data-remove-track]');if(remove){const track=tracks.find(item=>String(item.id)===String(remove.dataset.removeTrack));if(track)removed.push(track);tracks=tracks.filter(item=>String(item.id)!==String(remove.dataset.removeTrack));remove.closest('.edit-track').remove()}});modal.querySelector('form').onsubmit=async event=>{event.preventDefault();const button=modal.querySelector('button[type=submit]');button.disabled=true;button.textContent='Saving…';try{const base=currentUser.id+'/'+id;const cover=modal.querySelector('#editCover').files[0];const archive=modal.querySelector('#editArchive').files[0];let coverPath=current.cover_art_path,archivePath=current.archive_path,archiveSize=current.archive_size_bytes;if(cover){if(!/^image\/(png|jpe?g|webp)$/.test(cover.type)||cover.size>5*1024*1024)throw Error('Cover must be an image under 5 MB');coverPath=base+'/cover.'+cover.name.split('.').pop().toLowerCase();const upload=await supabaseClient.storage.from('covers').upload(coverPath,cover,{upsert:true,contentType:cover.type});if(upload.error)throw upload.error}if(archive){if(!archive.name.toLowerCase().endsWith('.zip')||archive.size>2*1024*1024*1024)throw Error('Archive must be a ZIP under 2 GB');archivePath=base+'/kit.zip';archiveSize=archive.size;const upload=await supabaseClient.storage.from('archives').upload(archivePath,archive,{upsert:true,contentType:'application/zip'});if(upload.error)throw upload.error}for(const track of removed){await supabaseClient.storage.from('demos').remove([track.audio_path]);const deleted=await supabaseClient.from('demo_tracks').delete().eq('id',track.id).eq('kit_id',id);if(deleted.error)throw deleted.error}const newDemos=[...(modal.querySelector('#editDemos').files||[])];for(let i=0;i<newDemos.length;i++){const file=newDemos[i];if(!/^audio\/(mpeg|wav|x-wav)$/.test(file.type)||file.size>25*1024*1024)throw Error('Demo files must be MP3/WAV under 25 MB');const path=base+'/demo-'+crypto.randomUUID()+'-'+file.name.replace(/[^a-z0-9._-]/gi,'_');const upload=await supabaseClient.storage.from('demos').upload(path,file,{upsert:false,contentType:file.type});if(upload.error)throw upload.error;const inserted=await supabaseClient.from('demo_tracks').insert({kit_id:id,title:file.name,audio_path:path,sort_order:tracks.length+i});if(inserted.error)throw inserted.error}for(const track of tracks){const title=modal.querySelector(`[data-track-id="${track.id}"] .track-title`)?.value.trim();if(title&&title!==track.title){const updated=await supabaseClient.from('demo_tracks').update({title}).eq('id',track.id).eq('kit_id',id);if(updated.error)throw updated.error}}const updated=await supabaseClient.from('kits').update({title:modal.querySelector('#editTitle').value.trim(),description:modal.querySelector('#editDescription').value.trim(),price:Number(modal.querySelector('#editPrice').value)||0,genre_tags:[modal.querySelector('#editGenre').value.trim()],license:modal.querySelector('#editLicense').value,visibility:modal.querySelector('#editVisibility').value,cover_art_path:coverPath,archive_path:archivePath,archive_size_bytes:archiveSize}).eq('id',id).eq('producer_id',currentUser.id);if(updated.error)throw updated.error;modal.remove();showToast('Kit updated');dashboard()}catch(saveError){button.disabled=false;button.textContent='Save changes';showToast(saveError.message||'Kit update failed')}}}async function deleteKit(id){if(!confirm('Remove this soundkit permanently?'))return;const row=document.querySelector(`[data-delete-kit="${id}"]`)?.closest('.manage-row');if(row)row.remove();const {data:kit}=await supabaseClient.from('kits').select('cover_art_path,archive_path').eq('id',id).eq('producer_id',currentUser.id).single();const {data:tracks}=await supabaseClient.from('demo_tracks').select('audio_path').eq('kit_id',id);const files={covers:kit?.cover_art_path?[kit.cover_art_path]:[],archives:kit?.archive_path?[kit.archive_path]:[],demos:(tracks||[]).map(t=>t.audio_path)};for(const [bucket,paths] of Object.entries(files))if(paths.length)await supabaseClient.storage.from(bucket).remove(paths);const {error}=await supabaseClient.from('kits').delete().eq('id',id).eq('producer_id',currentUser.id);if(error){showToast(error.message);dashboard();return}showToast('Kit removed');setTimeout(()=>dashboard(),250)}async function toggleKit(id,visibility){const next=visibility==='public'?'private':'public';const {error}=await supabaseClient.from('kits').update({visibility:next}).eq('id',id).eq('producer_id',currentUser.id);if(error){showToast(error.message);return}showToast(next==='public'?'Kit published':'Kit hidden');dashboard()}async function downloadKit(id){if(downloadInFlight.has(String(id)))return;downloadInFlight.add(String(id));const k=catalogKits.find(x=>String(x.id)===String(id));if(!supabaseClient||!currentUser){downloadInFlight.delete(String(id));showToast('Sign in to download kits');return}try{const {data,error}=await supabaseClient.from('kits').select('archive_path,title,visibility').eq('id',id).eq('visibility','public').single();if(error||!data?.archive_path){showToast('This kit has no available archive');return}const object=await supabaseClient.storage.from('archives').download(data.archive_path);if(object.error||!object.data){const message=object.error?.message||'';showToast(message.toLowerCase().includes('not found')?'Archive file is missing from Storage':'Download access was denied. Check archive Storage policies.');return}const recorded=await supabaseClient.rpc('record_kit_download',{target_kit_id:id});if(recorded.error){showToast('Download could not be recorded');return}const url=URL.createObjectURL(object.data);const link=document.createElement('a');link.href=url;link.download=(data.title||'drumvault-kit').replace(/[^a-z0-9-_]+/gi,'-').toLowerCase()+'.zip';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);showToast('Download started')}catch(error){showToast(error.message||'Download failed')}finally{downloadInFlight.delete(String(id))}}async function publishKit(){if(!supabaseClient||!currentUser){showToast('Sign in with Google before uploading');return}const title=document.getElementById('kitTitle')?.value.trim(),description=document.getElementById('kitDescription')?.value.trim(),genre=document.getElementById('kitGenre')?.value,price=Number(document.getElementById('kitPrice')?.value||0),license=document.getElementById('kitLicense')?.value||'ROYALTY-FREE',cover=document.getElementById('coverFile')?.files?.[0],demos=[...(document.getElementById('demoFiles')?.files||[])],archive=document.getElementById('archiveFile')?.files?.[0];if(!title||!description||!cover||!archive){showToast('Complete the title, description, cover, and ZIP');return}if(!/^image\/(png|jpe?g|webp)$/.test(cover.type)||cover.size>5*1024*1024){showToast('Cover must be PNG, JPG, or WebP under 5 MB');return}if(!archive.name.toLowerCase().endsWith('.zip')||archive.size>2*1024*1024*1024){showToast('ZIP must be under 2 GB');return}if(demos.length>3||demos.some(f=>!/^audio\/(mpeg|wav|x-wav)$/.test(f.type)||f.size>25*1024*1024)){showToast('Use up to 3 MP3/WAV demos under 25 MB each');return}const kitId=crypto.randomUUID(),base=currentUser.id+'/'+kitId;const ext=f=>f.name.split('.').pop().toLowerCase();try{const status=document.getElementById('uploadStatus'),statusText=document.getElementById('uploadStatusText'),progress=document.getElementById('uploadProgress');status?.classList.add('show');status?.classList.remove('success','error');if(statusText)statusText.textContent='Preparing upload…';if(progress)progress.style.width='5%';showToast('Uploading files…');let profileResult=await supabaseClient.from('profiles').upsert({id:currentUser.id,username:(currentUser.email||'producer').split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,30)||'producer',display_name:currentUser.user_metadata?.full_name||currentUser.email||'Producer',avatar_url:currentUser.user_metadata?.avatar_url||null},{onConflict:'id'});if(profileResult.error)throw profileResult.error;if(statusText)statusText.textContent='Uploading cover art…';if(progress)progress.style.width='20%';const coverPath=base+'/cover.'+ext(cover),archivePath=base+'/kit.zip';let r=await supabaseClient.storage.from('covers').upload(coverPath,cover,{upsert:false,contentType:cover.type});if(r.error)throw r.error;if(statusText)statusText.textContent='Uploading ZIP archive…';if(progress)progress.style.width='55%';r=await supabaseClient.storage.from('archives').upload(archivePath,archive,{upsert:false,contentType:'application/zip'});if(r.error)throw r.error;if(statusText)statusText.textContent='Uploading demo audio…';if(progress)progress.style.width='75%';const demoRows=[];for(let i=0;i<demos.length;i++){const path=base+'/'+String(i+1).padStart(2,'0')+'-'+demos[i].name.replace(/[^a-z0-9._-]/gi,'_');r=await supabaseClient.storage.from('demos').upload(path,demos[i],{upsert:false,contentType:demos[i].type});if(r.error)throw r.error;demoRows.push({title:demos[i].name,audio_path:path,sort_order:i})}let slug=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')+'-'+kitId.slice(0,8);r=await supabaseClient.from('kits').insert({id:kitId,producer_id:currentUser.id,title,slug,description,genre_tags:[genre],price,cover_art_path:coverPath,archive_path:archivePath,archive_size_bytes:archive.size,format:'WAV / 24-BIT',sample_count:Math.max(0,Number(document.getElementById('kitSampleCount')?.value||0)),license,contents_index:[]}).select().single();if(r.error)throw r.error;if(demoRows.length){r=await supabaseClient.from('demo_tracks').insert(demoRows.map(x=>({...x,kit_id:kitId})));if(r.error)throw r.error}if(progress)progress.style.width='100%';if(statusText)statusText.textContent='Published successfully. Your soundkit is now live.';status?.classList.add('success');showToast('Kit published successfully')}catch(error){const status=document.getElementById('uploadStatus'),statusText=document.getElementById('uploadStatusText');status?.classList.add('show','error');if(statusText)statusText.textContent=error.message||'Upload failed. No kit was published.';showToast(error.message||'Upload failed; no kit was published')}}async function updateAuth(){if(!supabaseClient)return;const {data}=await supabaseClient.auth.getUser();currentUser=data.user||null;const button=document.getElementById('profileButton'),dropdown=document.getElementById('profileDropdown'),chevron=document.getElementById('profileChevron');if(button){button.querySelector('.profile-label').textContent=currentUser?'Profile':'Sign in';button.querySelector('.avatar').textContent=currentUser&&currentUser.email?currentUser.email.slice(0,2).toUpperCase():'AM';}if(dropdown)dropdown.hidden=!currentUser;if(chevron)chevron.style.display=currentUser?'block':'none';}async function startAuth(){if(!supabaseClient){showToast('Add your Supabase anon key in index.html');return}if(currentUser){await supabaseClient.auth.signOut();showToast('Signed out');await updateAuth();return}const {error}=await supabaseClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:PRODUCTION_ORIGIN+location.pathname}});if(error)showToast(error.message)}document.getElementById('profileButton').onclick=()=>{if(!currentUser){startAuth();return}const dropdown=document.getElementById('profileDropdown');dropdown.hidden=!dropdown.hidden;document.getElementById('profileButton').setAttribute('aria-expanded',String(!dropdown.hidden))};document.getElementById('signOutButton').onclick=async()=>{await supabaseClient.auth.signOut();document.getElementById('profileDropdown').hidden=true;showToast('Signed out');await updateAuth()};document.addEventListener('click',e=>{if(!e.target.closest('.profile-menu')){const d=document.getElementById('profileDropdown');if(d)d.hidden=true}});if(supabaseClient)supabaseClient.auth.onAuthStateChange(()=>updateAuth());updateAuth();const savedTheme=localStorage.getItem('drumvault-theme');if(savedTheme==='dark'||(!savedTheme&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.body.classList.add('dark');document.getElementById('themeToggle').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('drumvault-theme',document.body.classList.contains('dark')?'dark':'light');document.getElementById('themeToggle').innerHTML=`<i data-lucide="${document.body.classList.contains('dark')?'sun':'moon'}"></i>`;icon()};document.getElementById('playerToggle').onclick=()=>{if(!audio.src){if(activeKit)play(activeKit.id);return}playing=!playing;if(playing)audio.play();else audio.pause();document.getElementById('playerToggle').innerHTML=`<i data-lucide="${playing?'pause':'play'}"></i>`;icon()};document.getElementById('backButton').onclick=()=>{audio.currentTime=Math.max(0,audio.currentTime-10)};document.getElementById('forwardButton').onclick=()=>{audio.currentTime=Math.min(audio.duration||0,audio.currentTime+10)};document.getElementById('seek').oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*(Number(e.target.value)/100)};document.querySelector('.volume input').oninput=e=>audio.volume=e.target.value/100;document.getElementById('searchInput').oninput=e=>{const q=e.target.value.toLowerCase();if(location.hash!=='#/'&&location.hash!=='')location.hash='/';setTimeout(()=>{const grid=document.getElementById('kitGrid');if(grid)grid.innerHTML=catalogKits.filter(k=>(k.title+k.producer+k.genre).toLowerCase().includes(q)).map(card).join('')||'<p class="detail-sub">No kits found.</p>';icon()},0)};function clock(value){if(!Number.isFinite(value))return '0:00';return Math.floor(value/60)+':'+String(Math.floor(value%60)).padStart(2,'0')}audio.onloadedmetadata=()=>{document.getElementById('duration').textContent=clock(audio.duration)};audio.ontimeupdate=()=>{const percent=audio.duration?audio.currentTime/audio.duration*100:0;document.getElementById('elapsed').textContent=clock(audio.currentTime);document.getElementById('seek').value=percent;document.getElementById('trackFill').style.width=percent+'%'};audio.onended=()=>{playing=false;document.getElementById('playerToggle').innerHTML='<i data-lucide="play"></i>';icon()};function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}function render(){const p=location.hash.slice(1).split('/');if(p[1]==='kit')detail(p[2]);else if(p[1]==='upload')upload();else if(p[1]==='producers')producers();else if(p[1]==='producer')producer(p[2]||'');else if(p[1]==='dashboard')dashboard();else if(p[1]==='settings')settings();else home()}window.onhashchange=render;render();
</script></body></html>
