<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drumvault — Sounds for producers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#fafafa;--surface:#fff;--ink:#111;--muted:#707070;--line:#e6e6e6;--orange:#ff5a1f;--soft:#f2f2f0;--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif}
body.dark{--bg:#111;--surface:#1a1a1a;--ink:#f5f5f3;--muted:#a1a1a1;--line:#333;--soft:#222}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);transition:background .2s,color .2s}
body.dark .nav{background:rgba(17,17,17,.94)}
body.dark .avatar{background:#f5f5f3;color:#111}
body.dark .player{background:#1a1a1a}
body.dark .art img,body.dark .detail-art,body.dark .profile-avatar{filter:brightness(.86)}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.app{min-height:100vh;padding-bottom:80px}
.nav{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;position:sticky;top:0;background:rgba(250,250,250,.94);backdrop-filter:blur(14px);z-index:20}
.brand{font-weight:700;font-size:18px;letter-spacing:-.04em;white-space:nowrap}
.brand i{display:inline-block;width:8px;height:8px;background:var(--orange);margin-left:2px}
.search{height:38px;max-width:430px;flex:1;margin:auto;position:relative}
.search input{width:100%;height:100%;border:1px solid var(--line);background:var(--surface);padding:0 15px 0 38px;border-radius:4px;outline:none;font-size:13px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#8a8a8a;pointer-events:none}
.search input{padding-left:38px}
.nav-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.nav-control{height:38px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.nav-control svg{width:15px;height:15px}
.profile-menu{position:relative}
.profile-btn{height:38px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.profile-btn>svg{width:14px}
.profile-dropdown{position:absolute;right:0;top:calc(100% + 8px);width:190px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:5px;box-shadow:0 12px 30px #0002;z-index:40}
.profile-dropdown[hidden]{display:none}
.profile-dropdown button{display:block;width:100%;border:0;background:transparent;color:var(--ink);text-align:left;padding:10px;border-radius:3px;font-size:12px}
.profile-dropdown button:hover{background:var(--soft)}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 15px;border-radius:4px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1}
.btn>svg{width:15px;height:15px;display:block;margin:0;flex:0 0 auto}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.engagement{display:inline-flex;align-items:center;gap:9px;color:var(--muted);font-family:var(--mono);font-size:10px}
.engagement span{display:inline-flex;align-items:center;gap:3px}
.engagement svg{width:12px;height:12px}
.like-button{display:inline-flex;align-items:center;gap:7px}
.like-button svg{width:15px}
.like-button.liked{color:var(--orange);border-color:var(--orange)}
.like-button.liked svg{fill:currentColor}
.avatar{width:30px;height:30px;border-radius:50%;background:#222;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600}
.wrap{max-width:1320px;margin:0 auto;padding:0 42px}
.hero{padding:68px 0 34px;display:flex;justify-content:space-between;align-items:flex-end}
.eyebrow{color:var(--orange);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:14px}
.hero h1{font-size:clamp(34px,5vw,58px);line-height:1;letter-spacing:-.065em;margin:0;max-width:670px;font-weight:600}
.hero p{color:var(--muted);font-size:16px;max-width:460px;line-height:1.6;margin:17px 0 0}
.hero-stat{text-align:right}
.hero-stat strong{font-size:30px;letter-spacing:-.06em;display:block}
.hero-stat span{color:var(--muted);font-size:12px}
.filters{display:flex;align-items:center;gap:8px;overflow-x:auto;overflow-y:hidden;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:28px;white-space:nowrap;scrollbar-width:thin}
.filters .pill{flex:0 0 auto}
.pill{white-space:nowrap;background:transparent;border:1px solid var(--line);border-radius:20px;padding:9px 14px;color:var(--muted);font-size:13px}
.pill.active{background:var(--ink);border-color:var(--ink);color:#fff}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}
.section-head h2{font-size:18px;margin:0;letter-spacing:-.03em}
.select{border:0;background:transparent;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 18px}
.card{min-width:0}
.art{aspect-ratio:1;border-radius:5px;overflow:hidden;position:relative;background:#ddd}
.art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.card:hover .art img{transform:scale(1.04)}
.play{position:absolute;left:13px;bottom:13px;width:38px;height:38px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;color:var(--ink);opacity:0;transition:.2s;box-shadow:0 2px 12px #0002}
.card:hover .play,.play.active{opacity:1}
.play.active{background:var(--orange);color:#fff}
.play svg{width:16px}
.card-info{padding-top:12px}
.card-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.producer{font-size:12px;color:var(--muted);margin-top:4px}
.producer:hover{text-decoration:underline;color:var(--ink)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px;color:var(--muted)}
.meta .tag,.meta .engagement,.meta .price{white-space:nowrap}
.tag{border:1px solid var(--line);padding:4px 6px;border-radius:3px;font-size:10px}
.price{font-weight:600;font-size:12px;color:var(--ink)}
.price.free{color:var(--orange)}
.player{position:fixed;bottom:0;left:0;right:0;height:76px;background:#fff;border-top:1px solid var(--line);z-index:30;display:none;align-items:center;padding:0 28px;gap:20px}
.player.show{display:flex}
.now-art{width:46px;height:46px;border-radius:3px;object-fit:cover}
.now-info{width:190px;min-width:120px}
.now-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-producer{font-size:11px;color:var(--muted);margin-top:3px}
.player-main{flex:1;display:flex;align-items:center;gap:15px}
.player-toggle,.player-skip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;flex:0 0 auto}
.player-toggle{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.player-toggle svg,.player-skip svg{width:14px}
.timeline{flex:1;min-width:120px;display:flex;flex-direction:column;gap:4px}
.time-row{display:flex;justify-content:space-between}
.time{font-family:var(--mono);font-size:10px;color:var(--muted)}
.seek{width:100%;height:4px;accent-color:var(--orange);cursor:pointer}
.wave-track{height:30px;background:var(--line);position:relative;border-radius:4px;margin-top:-10px;pointer-events:none;overflow:hidden}
.waveform{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-around;gap:2px;padding:4px 2px}
.waveform i{display:block;flex:1;max-width:3px;background:var(--muted);opacity:.48;border-radius:2px}
.track-fill{position:absolute;left:0;top:0;height:100%;background:var(--orange);width:0;opacity:.45;border-radius:4px}
.player-skip:hover,.player-toggle:hover{border-color:var(--orange);transform:translateY(-1px)}
body.dark .player-toggle{background:#f5f5f3;color:#111;border-color:#f5f5f3}
body.dark .player-skip{background:#1f1f1f;color:#f5f5f3;border-color:#444}
.volume{display:flex;align-items:center;gap:8px;color:var(--muted)}
.volume input{width:75px;accent-color:var(--ink)}
.page{padding:48px 0}
.back{color:var(--muted);font-size:12px;display:inline-flex;gap:6px;align-items:center;margin-bottom:30px}
.detail{display:grid;grid-template-columns:minmax(300px,470px) 1fr;gap:72px}
.detail-art{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px}
.detail h1{font-size:clamp(34px,5vw,58px);letter-spacing:-.07em;line-height:.95;margin:12px 0}
.detail-sub{color:var(--muted);line-height:1.6;font-size:14px;max-width:600px}
.detail-actions{display:flex;gap:9px;margin:27px 0 38px}
.specs{border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:20px 0;margin-bottom:30px}
.spec label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;margin-bottom:7px}
.spec strong{font-family:var(--mono);font-size:12px;font-weight:400}
.tracklist h3,.contents h3{font-size:13px;margin:0 0 13px}
.demo-row{display:flex;align-items:center;border-top:1px solid var(--line);padding:12px 0;gap:11px}
.mini-play{border:1px solid var(--line);background:#fff;width:25px;height:25px;border-radius:50%;display:grid;place-items:center}
.mini-play svg{width:11px}
.demo-name{font-size:12px;flex:1}
.demo-meta{color:var(--muted);font-family:var(--mono);font-size:10px}
.contents{margin-top:34px}
.folder{border-top:1px solid var(--line);padding:13px 0;font-size:12px}
.folder span{color:var(--muted);font-family:var(--mono);font-size:10px;float:right}
.upload{max-width:760px;margin:0 auto}
.upload h1{font-size:46px;letter-spacing:-.07em;margin:12px 0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{margin-top:20px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;display:block;margin-bottom:8px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:4px;padding:12px 13px;outline:none;font-size:13px}
.field textarea{min-height:110px;resize:vertical}
.drop{border:1px dashed #bcbcbc;background:#fff;padding:27px;text-align:center;border-radius:4px;color:var(--muted);font-size:12px}
.drop svg{width:20px;margin-bottom:7px}
.drop strong{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}
.upload-submit{margin-top:28px;width:100%;padding:13px}
.profile-settings-head{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:20px}
.profile-settings-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--soft);border:1px solid var(--line)}
.profile-settings-copy h2{font-size:20px;letter-spacing:-.04em;margin:0 0 4px}
.profile-settings-copy p{font-size:12px;color:var(--muted);margin:0}
.profile-save{margin-top:36px;min-width:150px}
.edit-modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:60}
.avatar-crop-modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:80}
.avatar-crop-card{width:min(470px,100%);background:#181818;border:1px solid #333;border-radius:6px;padding:22px;color:#f5f5f5}
.avatar-crop-card h2{margin:0 0 6px;font-size:20px}
.avatar-crop-card p{color:#aaa;font-size:12px;margin:0 0 16px}
.crop-stage{width:min(380px,82vw);aspect-ratio:1;margin:0 auto 18px;position:relative;overflow:hidden;background:#080808;touch-action:none}
.crop-stage canvas{width:100%;height:100%;display:block}
.crop-stage:after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px #0009;pointer-events:none;border:2px solid #fff}
.crop-controls{display:flex;align-items:center;gap:10px}
.crop-controls input{flex:1;accent-color:var(--orange)}
.avatar-crop-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.edit-card{width:min(620px,100%);max-height:90vh;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--muted) transparent;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:26px;box-shadow:0 20px 60px #0004}
.edit-card::-webkit-scrollbar{width:7px}
.edit-card::-webkit-scrollbar-thumb{background:var(--muted);border-radius:8px}
.edit-card h2{margin:0 0 20px;font-size:24px;letter-spacing:-.05em}
.edit-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:28px}
.edit-track{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px;border:1px solid var(--line);border-radius:4px;margin-top:8px}
.edit-track .track-title{flex:1;min-width:0}
.file-drop{display:flex;flex-direction:column;gap:5px;border:1px dashed var(--line);padding:14px;border-radius:4px;background:var(--soft);cursor:pointer}
.file-drop strong{font-size:12px}
.file-drop span{font-size:11px;color:var(--muted)}
.file-drop input{font-size:11px;margin-top:4px}
.producer-page{max-width:1120px;margin:auto}
.profile{display:grid;grid-template-columns:82px minmax(0,1fr);column-gap:22px;row-gap:18px;border-bottom:1px solid var(--line);padding:50px 0 35px;margin-bottom:30px}
.profile-avatar{width:82px;height:82px;border-radius:50%;background:#e3e0d7;object-fit:cover;grid-row:span 2}
.profile h1{margin:0 0 8px;font-size:32px;letter-spacing:-.06em}
.profile p{margin:0;color:var(--muted);font-size:13px}
.profile-stats{display:flex;align-items:flex-start;justify-content:flex-start;gap:0;text-align:left;margin:0;border-top:1px solid var(--line);padding-top:16px;max-width:560px}
.profile-stat{display:flex;flex-direction:column;gap:5px;min-width:108px;padding-right:24px;margin-right:24px;border-right:1px solid var(--line)}
.profile-stat:last-child{border-right:0;margin-right:0}
.profile-stat strong{font-size:22px}
.stat-button{border:0;background:transparent;color:inherit;text-align:left;padding:0;cursor:pointer}
.stat-button:hover strong{color:var(--orange)}
.profile-stats strong{font-size:20px;line-height:1;display:block;letter-spacing:-.04em}
.profile-stats span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
@media(max-width:620px){.profile-stats{width:100%;margin-left:0;margin-top:8px;gap:18px;overflow:auto}
.profile-stat{min-width:max-content}}
.toast{position:fixed;right:20px;top:90px;background:var(--ink);color:#fff;padding:13px 17px;border-radius:4px;font-size:12px;transform:translateY(-20px);opacity:0;transition:.25s;z-index:50}
.upload-status{margin-top:18px;border:1px solid var(--line);background:var(--soft);padding:13px;border-radius:4px;font-size:13px;display:none}
.upload-status.show{display:block}
.upload-status.success{border-color:#248a53;color:#176138;background:#eaf7ef}
.upload-status.error{border-color:#c43b3b;color:#a52222;background:#fff0f0}
.progress{height:4px;background:var(--line);margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--orange);width:0;transition:width .25s}
.dashboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 35px}
.producer-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
.producer-card{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:22px 14px 18px;min-height:280px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:border-color .2s,transform .2s,box-shadow .2s}
.producer-card:hover{border-color:var(--orange);transform:translateY(-2px);box-shadow:0 10px 26px #0000001a}
.producer-card>a{display:flex;flex-direction:column;align-items:center;width:100%}
.producer-card .profile-avatar{width:122px;height:122px;display:block;margin-bottom:16px;object-fit:cover;border-radius:50%;border:4px solid var(--soft);transition:transform .2s}
.producer-card:hover .profile-avatar{transform:scale(1.04)}
.producer-card h2{font-size:16px;letter-spacing:-.035em;margin:0 0 4px}
.producer-card>a>p:first-of-type{font-family:var(--mono);font-size:10px;color:var(--muted);margin:0 0 10px}
.producer-card>a>p:last-of-type{color:var(--muted);font-size:12px;line-height:1.4;margin:0;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;width:100%}
.producer-stats{display:flex;gap:8px;border:0;margin-top:auto;padding-top:16px;margin-bottom:14px;color:var(--muted);font-size:10px;white-space:nowrap}
.producer-card .small-btn{width:auto;margin-top:0;border-radius:18px;padding:8px 18px}
.producer-card .small-btn:hover{background:var(--orange);border-color:var(--orange);color:#fff}
@media(max-width:1100px){.producer-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:800px){.producer-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.producer-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.producer-card{padding:18px 8px;min-height:250px}
.producer-card .profile-avatar{width:92px;height:92px}
.producer-stats{gap:5px;font-size:9px}
.producer-card .small-btn{padding:7px 13px}}
.dashboard-stat{border:1px solid var(--line);background:var(--surface);padding:18px;border-radius:4px}
.dashboard-stat strong{display:block!important;font-size:26px;line-height:1.1;letter-spacing:-.05em;margin-bottom:8px}
.dashboard-stat span{display:block!important;color:var(--muted);font-size:12px;line-height:1.4}
.manage-info span{display:flex!important;align-items:center;gap:12px;margin-top:8px}
.manage-info strong{display:block!important;margin-bottom:0}
.manage-actions{display:flex!important;align-items:center;gap:10px!important}
.visibility-badge{display:inline-flex;align-items:center;line-height:1}
.manage-row{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);padding:15px 0}
.manage-row .manage-info{flex:1;min-width:0}
.manage-info strong{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.manage-info span{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;margin-top:7px;line-height:1.4}
.manage-info em{font-style:normal}
.visibility-badge{font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border:1px solid var(--line);border-radius:10px;color:var(--muted)}
.manage-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.small-btn{font-size:11px;padding:7px 10px;white-space:nowrap}
.toast.show{transform:translateY(0);opacity:1}
@media(max-width:900px){.nav{gap:15px}
.nav .search{order:3;flex-basis:100%;max-width:none}
.nav{height:auto;flex-wrap:wrap}
.nav-actions{margin-left:auto}
.nav-actions .btn:nth-child(3){display:none}
.wrap{padding:0 20px}
.hero{padding-top:45px}
.grid{grid-template-columns:repeat(3,1fr)}
.detail{gap:35px}
.player{padding:0 15px;gap:10px}
.now-info{width:130px}
.volume{display:none}}
@media(max-width:620px){.nav{}
.brand{font-size:15px}
.nav-actions{gap:6px}
.nav-actions .btn{padding:7px 9px}
.profile-label{display:none}
.hero{display:block;padding-top:34px}
.hero-stat{text-align:left;margin-top:25px}
.hero h1{font-size:42px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}
.detail{display:block}
.detail h1{font-size:42px}
.detail-art{margin-bottom:28px}
.specs{grid-template-columns:repeat(2,1fr);gap:20px}
.form-grid{display:block}
.profile{align-items:flex-start;flex-wrap:wrap}
.profile-stats{margin-left:104px;margin-top:-32px;text-align:left}
.player{height:68px;padding:0 10px}
.now-art{width:38px;height:38px}
.now-info{width:105px}
.timeline{gap:5px}
.time{font-size:9px}
.player-main{gap:8px}
.back{margin-bottom:22px}
.page{padding-top:28px}
.filters{margin-left:-20px;margin-right:-20px;padding-left:20px;padding-right:20px}
.drop{padding:22px 12px}}
.profile-btn{display:flex;align-items:center;gap:8px}
.profile-label{font-size:12px}
.section-head{padding-top:5px}
.community-header{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding:24px 0 18px;margin-bottom:24px}
.community-header h1{font-size:34px;margin:0 0 8px;letter-spacing:-.06em}

.page{padding-top:48px;padding-bottom:64px}

.producer-page{max-width:var(--maxw);margin-left:auto;margin-right:auto}
.nav{padding-left:max(var(--gutter),calc((100% - var(--maxw))/2 + var(--gutter)));padding-right:max(var(--gutter),calc((100% - var(--maxw))/2 + var(--gutter)))}
.nav{padding-top:0;padding-bottom:0}
@media(max-width:900px){.nav{padding-top:12px;padding-bottom:12px}}

/* Page titles share one scale; hero and kit title stay larger on purpose */
.eyebrow{margin-bottom:14px}
.eyebrow+h1{margin-top:0}
.community-header h1,.upload h1,.wrap.page>h1,.profile h1{font-size:var(--page-title);line-height:1.05;letter-spacing:-.05em;margin:0 0 12px}
.wrap.page>.detail-sub{margin:0 0 28px}

/* Grids: equal tracks that can never be pushed wider than the page */
.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:32px 20px}
.grid.producer-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}
@media(max-width:1100px){.grid.producer-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 16px}.grid.producer-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 12px}.grid.producer-grid{gap:12px}}

/* Kit cards */
.card-link{display:block}
.card-title-link{display:block;color:inherit}
.card-info{padding:14px 2px 0}
.meta{margin-top:11px}
.meta .price{min-width:34px;text-align:right}

/* Sort dropdowns look the same everywhere */
.select{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--muted);font-size:12px}

/* Form controls: one height */
.field input:not([type=file]),.field select{height:var(--control-h);padding-top:0;padding-bottom:0}
.field textarea{min-height:110px}
.upload-submit,.profile-save{min-height:var(--control-h)}
.field label .mono{font-weight:400;font-size:10px;color:var(--muted);margin-left:6px}

/* Kit page: columns start on the same line; secondary buttons follow the theme */
.detail{align-items:start}
.detail>div>h1:first-child{margin-top:0}
body:not(.dark) .detail-actions .btn:not(.primary){color:var(--ink);background:var(--surface);border-color:var(--line)}
body:not(.dark) .detail-actions .btn:not(.primary):hover{background:var(--soft);color:var(--ink)}

/* Dashboard rows: action buttons line up in columns */
.btn.small-btn{min-height:32px}
.manage-actions .btn{min-width:68px;justify-content:center;text-align:center}

/* Producer profile stats must wrap instead of overflowing on phones */
@media(max-width:620px){
.profile{grid-template-columns:72px minmax(0,1fr);column-gap:16px;padding-top:28px}
.profile-avatar{width:72px;height:72px}
.profile-stats{grid-column:1/-1;margin:0;max-width:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 16px}
.profile-stat{min-width:0;padding:0;margin:0;border-right:0}
}

/* Header grid: every child gets an explicit cell so actions always hug the right edge */
.nav>.brand{grid-column:1;grid-row:1}
.nav>.main-links{grid-column:2;grid-row:1}
.nav>.search{grid-column:3;grid-row:1}
.nav>.nav-actions{grid-column:4;grid-row:1;justify-self:end;margin-left:0}
@media(max-width:1100px){.nav>.search{grid-column:2}.nav>.nav-actions{grid-column:3}}

/* Producer cards never push the grid wider */
.producer-card{min-width:0;overflow:hidden}
.producer-stats{flex-wrap:wrap;justify-content:center;row-gap:2px}

/* ===== Player (Spotify-style) ===== */
.app{padding-bottom:104px}
.player{height:84px;grid-template-columns:minmax(0,1fr) minmax(300px,600px) minmax(0,1fr);align-items:center;column-gap:24px;padding:0 var(--gutter);background:var(--surface);border-top:1px solid var(--line);box-shadow:none}
.player.show{display:grid}

.player .player-skip{width:32px;height:32px;border:0;background:transparent;color:var(--muted);border-radius:50%;display:grid;place-items:center;padding:0;transition:color .15s,transform .1s}

.player .volume .player-skip svg{fill:none}

.player .player-toggle:hover{transform:scale(1.06);border-color:transparent;background:var(--ink)}
.player .player-toggle svg{width:16px;height:16px;fill:currentColor}
.player .timeline{display:flex;flex-direction:row;align-items:center;gap:10px;width:100%;min-width:0}
.player .time{width:38px;flex:0 0 auto;font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.player #duration{text-align:left}
.player .volume{justify-self:end;display:flex;align-items:center;gap:6px;width:160px}
.player .volume .range{width:auto}
.range{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:14px;margin:0;padding:0;border:0;background:transparent;cursor:pointer;outline:none;--pct:0%;--fill:var(--ink);--track:#d6d6d6}
body.dark input.range{background:transparent;border:0;--track:#4a4a4a}
.timeline:hover .range,.volume:hover .range{--fill:var(--orange)}
.range::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--fill) var(--pct),var(--track) var(--pct))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0006;opacity:0;transition:opacity .12s}
.timeline:hover .range::-webkit-slider-thumb,.volume:hover .range::-webkit-slider-thumb,.range:focus-visible::-webkit-slider-thumb{opacity:1}
.range::-moz-range-track{height:4px;border-radius:2px;background:var(--track)}
.range::-moz-range-progress{height:4px;border-radius:2px;background:var(--fill)}
.range::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0006;opacity:0}
.timeline:hover .range::-moz-range-thumb,.volume:hover .range::-moz-range-thumb{opacity:1}
body.dark .player .player-skip{background:transparent;border:0;color:#b8b8b8}
body.dark .player .player-skip:hover{background:transparent;color:#fff}
body.dark .player .player-toggle,body.dark .player .player-toggle:hover{background:#f5f5f5;color:#111;border:0}
@media(max-width:820px){.player{grid-template-columns:minmax(0,1fr) minmax(220px,1.4fr) auto;column-gap:14px}.player .volume{width:auto}.player .vol-range{display:none}}
@media(max-width:620px){.app{padding-bottom:124px}
.player{height:auto;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;row-gap:6px;padding:10px 16px 12px}
.player .player-main{display:contents}
.player .now-playing{grid-column:1;grid-row:1}
.player .player-controls{grid-column:2;grid-row:1;gap:10px}

.player .volume{display:none}
.player .now-art{width:44px;height:44px}}
