function home(){shell(`<div class="wrap"><section class="hero"><div><div class="eyebrow">DRUMVAULT / CATALOG</div><h1>Professional sounds for production.</h1><p>Browse curated drumkits, loops, and textures from independent sound designers.</p></div><div class="hero-stat"><strong>12,480</strong><span>available sounds</span></div></section><div class="filters">${['All','Trap','Boom Bap','Lo-Fi','R&B','House / Electronic','Percussion / Foley','Free','Paid'].map((x,i)=>`<button class="pill ${i===0?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><div class="section-head"><h2>Soundkits</h2><select class="select"><option>Sort: newest</option><option>Sort: most downloaded</option></select></div><div class="grid" id="kitGrid">${kits.map(card).join('')}</div></div>`)}
function detail(id){const k=kits.find(x=>x.id==id)||kits[0];activeKit=k;shell(`<div class="wrap page"><a class="back" href="#/"><i data-lucide="arrow-left"></i> Back to explore</a><div class="detail"><div><img class="detail-art" src="${k.cover}" alt="${k.title}"><div class="detail-actions"><button class="btn primary" data-download="${k.id}"><i data-lucide="download"></i> Download Kit</button><button class="btn" data-share><i data-lucide="link"></i> Copy link</button></div><div class="specs"><div class="spec"><label>File size</label><strong>${k.size}</strong></div><div class="spec"><label>Format</label><strong>${k.format}</strong></div><div class="spec"><label>Sounds</label><strong>${k.count} files</strong></div><div class="spec"><label>License</label><strong>${k.license}</strong></div></div></div><div><div class="eyebrow">${k.genre} / ${k.format}</div><h1>${k.title}</h1><a class="producer" href="#/producer/${k.producer}">Produced by ${k.producer} ↗</a><p class="detail-sub">${k.desc}</p><div class="tracklist"><h3>Demo tracks</h3>${['01 — Dusty kick loop','02 — Room tone texture','03 — Afterglow chords'].map((x,i)=>`<div class="demo-row"><button class="mini-play" data-play="${k.id}"><i data-lucide="play"></i></button><span class="demo-name">${x}</span><span class="demo-meta">0${i+1}:0${i+8}</span></div>`).join('')}</div><div class="contents"><h3>Contents preview</h3>${['DRUMS / KICKS','DRUMS / SNARES','LOOPS / MELODIC','TEXTURES / FOLEY'].map((x,i)=>`<div class="folder"><i data-lucide="folder"></i> ${x}<span>${i+12} files</span></div>`).join('')}</div></div></div></div>`)}
function upload(){shell(`<div class="wrap page"><div class="upload"><div class="eyebrow">PUBLISH / CREATOR ACCOUNT</div><h1>Publish a soundkit.</h1><p class="detail-sub">Add your kit details, upload the supporting files, and make the collection available to producers.</p><div class="form-grid"><div class="field full"><label>Kit title</label><input id="kitTitle" placeholder="e.g. Midnight Frequencies Vol. 2"></div><div class="field full"><label>Description</label><textarea id="kitDescription" placeholder="Describe the sounds in this kit"></textarea></div><div class="field"><label>Genre</label><select id="kitGenre"><option>Trap</option><option>Lo-Fi</option><option>House / Electronic</option></select></div><div class="field"><label>Price (USD)</label><input id="kitPrice" type="number" min="0" step="1" placeholder="0 for free"></div><div class="field full"><label>Cover art</label><div class="drop"><i data-lucide="image"></i><strong>Choose a square image</strong><input id="coverFile" type="file" accept="image/png,image/jpeg,image/webp">PNG, JPG, or WebP · 5 MB maximum</div></div><div class="field full"><label>Demo audio <span class="mono">up to 3 tracks</span></label><div class="drop"><i data-lucide="music-2"></i><strong>Choose MP3 or WAV previews</strong><input id="demoFiles" type="file" accept="audio/mpeg,audio/wav,audio/x-wav" multiple>90 seconds maximum per track</div></div><div class="field full"><label>Main kit archive</label><div class="drop"><i data-lucide="archive"></i><strong>Choose your ZIP archive</strong><input id="archiveFile" type="file" accept="application/zip,.zip">2 GB maximum</div></div></div><button class="btn primary upload-submit" data-submit>Publish kit</button><div id="uploadStatus" class="upload-status"><span id="uploadStatusText"></span><div class="progress"><i id="uploadProgress"></i></div></div></div></div>`)}
async function dashboard(){if(!supabaseClient||!currentUser){shell('<div class="wrap page"><div class="upload"><div class="eyebrow">Creator account</div><h1>Creator dashboard</h1><p class="detail-sub">Sign in with Google to manage your soundkits.</p></div></div>');return}const result=await supabaseClient.from('kits').select('id,title,slug,cover_art_path,download_count,visibility,created_at').eq('producer_id',currentUser.id).order('created_at',{ascending:false});const rows=result.data||[];const downloads=rows.reduce((n,k)=>n+(k.download_count||0),0);shell(`<div class="wrap page"><div class="eyebrow">Creator account</div><h1>Dashboard</h1><p class="detail-sub">Manage your published soundkits and review performance.</p><div class="dashboard-grid"><div class="dashboard-stat"><strong>${rows.length}</strong><span>Published kits</span></div><div class="dashboard-stat"><strong>${downloads}</strong><span>Total downloads</span></div><div class="dashboard-stat"><strong>0</strong><span>Likes and comments</span></div></div><div class="section-head"><h2>Your soundkits</h2><button class="btn primary" data-route="upload">Upload kit</button></div>${rows.length?rows.map(k=>`<div class="manage-row"><div class="manage-info"><strong>${k.title}</strong><span>${k.visibility||'public'} · ${k.download_count||0} downloads</span></div><div class="manage-actions"><button class="btn small-btn" data-edit-kit="${k.id}">Edit</button><button class="btn small-btn" data-toggle-kit="${k.id}" data-visibility="${k.visibility||'public'}">${k.visibility==='public'?'Hide':'Publish'}</button><button class="btn small-btn" data-delete-kit="${k.id}">Remove</button></div></div>`).join(''):'<p class="detail-sub">No kits published yet.</p>'}</div>`)}function producer(name='NOVA'){const k=kits.filter(x=>x.producer===name);const p=k[0]||kits[0];shell(`<div class="wrap producer-page"><div class="profile"><img class="profile-avatar" src="${p.cover}"><div><h1>${name}</h1><p>${p.bio}</p><p class="mono" style="margin-top:12px">SoundCloud&nbsp;&nbsp; Instagram&nbsp;&nbsp; YouTube</p></div><div class="profile-stats"><strong>${p.downloads}</strong><span>total downloads</span></div></div><div class="section-head"><h2>Published soundkits</h2><span class="mono">${k.length||1} published</span></div><div class="grid">${(k.length?k:kits.slice(0,4)).map(card).join('')}</div></div>`)}
function play(id){const k=kits.find(x=>x.id==id)||kits[0];activeKit=k;document.getElementById('player').classList.add('show');document.getElementById('nowArt').src=k.cover;document.getElementById('nowTitle').textContent=k.title;document.getElementById('nowProducer').textContent='by '+k.producer;playing=!playing;document.getElementById('playerToggle').innerHTML=`<i data-lucide="${playing?'pause':'play'}"></i>`;icon();if(playing){audio.src='https://cdn.pixabay.com/download/audio/2022/03/15/audio_8a8e4f9d4a.mp3?filename=lofi-study-112191.mp3';audio.play().catch(()=>{})}else audio.pause()}
document.addEventListener('click',e=>{const playBtn=e.target.closest('[data-play]');if(playBtn){play(playBtn.dataset.play);return}const route=e.target.closest('[data-route]');if(route){location.hash='/'+route.dataset.route;return}if(e.target.closest('[data-edit-kit]')){editKit(e.target.closest('[data-edit-kit]').dataset.editKit);return}if(e.target.closest('[data-delete-kit]')){deleteKit(e.target.closest('[data-delete-kit]').dataset.deleteKit);return}if(e.target.closest('[data-toggle-kit]')){toggleKit(e.target.closest('[data-toggle-kit]').dataset.toggleKit,e.target.closest('[data-toggle-kit]').dataset.visibility);return}if(e.target.closest('[data-download]')){downloadKit(e.target.closest('[data-download]').dataset.download);return}if(e.target.closest('[data-share]')){navigator.clipboard?.writeText(location.href);showToast('Link copied to clipboard');return}if(e.target.closest('[data-submit]')){publishKit();return}const filter=e.target.closest('[data-filter]');if(filter){document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));filter.classList.add('active');const q=filter.dataset.filter.toLowerCase();document.getElementById('kitGrid').innerHTML=kits.filter(k=>q==='all'||k.genre.toLowerCase().includes(q)|| (q==='free'&&k.price==='FREE') || (q==='paid'&&k.price!=='FREE')).map(card).join('');icon()}});
async function editKit(id){const current=(await supabaseClient.from('kits').select('title,description,price,genre_tags,visibility').eq('id',id).eq('producer_id',currentUser.id).single()).data;if(!current)return;const title=prompt('Kit title',current.title);if(!title?.trim())return;const description=prompt('Description',current.description||'');const price=prompt('Price in USD',current.price||0);const genre=prompt('Genre',current.genre_tags?.[0]||'Trap');const visibility=prompt('Visibility: public or private',current.visibility||'public');if(!['public','private'].includes(visibility))return showToast('Visibility must be public or private');const {error}=await supabaseClient.from('kits').update({title:title.trim(),description:description||'',price:Number(price)||0,genre_tags:[genre||'Trap'],visibility}).eq('id',id).eq('producer_id',currentUser.id);if(error){showToast(error.message);return}showToast('Kit updated');dashboard()}async function deleteKit(id){if(!confirm('Remove this soundkit permanently?'))return;const row=document.querySelector(`[data-delete-kit="${id}"]`)?.closest('.manage-row');if(row)row.remove();const {error}=await supabaseClient.from('kits').delete().eq('id',id).eq('producer_id',currentUser.id);if(error){showToast(error.message);dashboard();return}showToast('Kit removed');setTimeout(()=>dashboard(),250)}async function toggleKit(id,visibility){const next=visibility==='public'?'private':'public';const {error}=await supabaseClient.from('kits').update({visibility:next}).eq('id',id).eq('producer_id',currentUser.id);if(error){showToast(error.message);return}showToast(next==='public'?'Kit published':'Kit hidden');dashboard()}async function downloadKit(id){const k=kits.find(x=>x.id==id);if(!supabaseClient||!currentUser){showToast('Sign in to download kits');return}const {data,error}=await supabaseClient.from('kits').select('archive_path,title').eq('id',id).single();if(error||!data?.archive_path){showToast('This demo kit is not available for download yet');return}const signed=await supabaseClient.storage.from('archives').createSignedUrl(data.archive_path,120);if(signed.error){showToast('Download link could not be created');return}await supabaseClient.from('downloads').insert({kit_id:id,user_id:currentUser.id});window.location.href=signed.data.signedUrl}async function publishKit(){if(!supabaseClient||!currentUser){showToast('Sign in with Google before uploading');return}const title=document.getElementById('kitTitle')?.value.trim(),description=document.getElementById('kitDescription')?.value.trim(),genre=document.getElementById('kitGenre')?.value,price=Number(document.getElementById('kitPrice')?.value||0),cover=document.getElementById('coverFile')?.files?.[0],demos=[...(document.getElementById('demoFiles')?.files||[])],archive=document.getElementById('archiveFile')?.files?.[0];if(!title||!description||!cover||!archive){showToast('Complete the title, description, cover, and ZIP');return}if(!/^image\/(png|jpe?g|webp)$/.test(cover.type)||cover.size>5*1024*1024){showToast('Cover must be PNG, JPG, or WebP under 5 MB');return}if(!archive.name.toLowerCase().endsWith('.zip')||archive.size>2*1024*1024*1024){showToast('ZIP must be under 2 GB');return}if(demos.length>3||demos.some(f=>!/^audio\/(mpeg|wav|x-wav)$/.test(f.type)||f.size>25*1024*1024)){showToast('Use up to 3 MP3/WAV demos under 25 MB each');return}const kitId=crypto.randomUUID(),base=currentUser.id+'/'+kitId;const ext=f=>f.name.split('.').pop().toLowerCase();try{const status=document.getElementById('uploadStatus'),statusText=document.getElementById('uploadStatusText'),progress=document.getElementById('uploadProgress');status?.classList.add('show');status?.classList.remove('success','error');if(statusText)statusText.textContent='Preparing upload…';if(progress)progress.style.width='5%';showToast('Uploading files…');let profileResult=await supabaseClient.from('profiles').upsert({id:currentUser.id,username:(currentUser.email||'producer').split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,30)||'producer',display_name:currentUser.user_metadata?.full_name||currentUser.email||'Producer',avatar_url:currentUser.user_metadata?.avatar_url||null},{onConflict:'id'});if(profileResult.error)throw profileResult.error;if(statusText)statusText.textContent='Uploading cover art…';if(progress)progress.style.width='20%';const coverPath=base+'/cover.'+ext(cover),archivePath=base+'/kit.zip';let r=await supabaseClient.storage.from('covers').upload(coverPath,cover,{upsert:false,contentType:cover.type});if(r.error)throw r.error;if(statusText)statusText.textContent='Uploading ZIP archive…';if(progress)progress.style.width='55%';r=await supabaseClient.storage.from('archives').upload(archivePath,archive,{upsert:false,contentType:'application/zip'});if(r.error)throw r.error;if(statusText)statusText.textContent='Uploading demo audio…';if(progress)progress.style.width='75%';const demoRows=[];for(let i=0;i<demos.length;i++){const path=base+'/'+String(i+1).padStart(2,'0')+'-'+demos[i].name.replace(/[^a-z0-9._-]/gi,'_');r=await supabaseClient.storage.from('demos').upload(path,demos[i],{upsert:false,contentType:demos[i].type});if(r.error)throw r.error;demoRows.push({title:demos[i].name,audio_path:path,sort_order:i})}let slug=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')+'-'+kitId.slice(0,8);r=await supabaseClient.from('kits').insert({id:kitId,producer_id:currentUser.id,title,slug,description,genre_tags:[genre],price,cover_art_path:coverPath,archive_path:archivePath,archive_size_bytes:archive.size,format:'WAV / 24-BIT',sample_count:0}).select().single();if(r.error)throw r.error;if(demoRows.length){r=await supabaseClient.from('demo_tracks').insert(demoRows.map(x=>({...x,kit_id:kitId})));if(r.error)throw r.error}if(progress)progress.style.width='100%';if(statusText)statusText.textContent='Published successfully. Your soundkit is now live.';status?.classList.add('success');showToast('Kit published successfully')}catch(error){const status=document.getElementById('uploadStatus'),statusText=document.getElementById('uploadStatusText');status?.classList.add('show','error');if(statusText)statusText.textContent=error.message||'Upload failed. No kit was published.';showToast(error.message||'Upload failed; no kit was published')}}async function updateAuth(){if(!supabaseClient)return;const {data}=await supabaseClient.auth.getUser();currentUser=data.user||null;const b=document.getElementById('authButton');if(b)b.querySelector('.profile-label').textContent=currentUser?'Sign out':'Sign in';if(currentUser&&currentUser.email)b.querySelector('.avatar').textContent=currentUser.email.slice(0,2).toUpperCase()}async function startAuth(){if(!supabaseClient){showToast('Add your Supabase anon key in index.html');return}if(currentUser){await supabaseClient.auth.signOut();showToast('Signed out');await updateAuth();return}const {error}=await supabaseClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)showToast(error.message)}document.getElementById('authButton').onclick=startAuth;if(supabaseClient)supabaseClient.auth.onAuthStateChange(()=>updateAuth());updateAuth();const savedTheme=localStorage.getItem('drumvault-theme');if(savedTheme==='dark'||(!savedTheme&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.body.classList.add('dark');document.getElementById('themeToggle').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('drumvault-theme',document.body.classList.contains('dark')?'dark':'light');document.getElementById('themeToggle').innerHTML=`<i data-lucide="${document.body.classList.contains('dark')?'sun':'moon'}"></i>`;icon()};document.getElementById('playerToggle').onclick=()=>{if(activeKit)play(activeKit.id)};document.getElementById('track').onclick=e=>{const r=e.offsetX/e.currentTarget.clientWidth;document.getElementById('trackFill').style.width=(r*100)+'%';if(audio.duration)audio.currentTime=audio.duration*r};document.querySelector('.volume input').oninput=e=>audio.volume=e.target.value/100;document.getElementById('searchInput').oninput=e=>{const q=e.target.value.toLowerCase();if(location.hash!=='#/'&&location.hash!=='')location.hash='/';setTimeout(()=>{const grid=document.getElementById('kitGrid');if(grid)grid.innerHTML=kits.filter(k=>(k.title+k.producer+k.genre).toLowerCase().includes(q)).map(card).join('')||'<p class="detail-sub">No kits found.</p>';icon()},0)};audio.ontimeupdate=()=>{document.getElementById('elapsed').textContent='0:'+String(Math.floor(audio.currentTime)).padStart(2,'0');document.getElementById('trackFill').style.width=(audio.currentTime/(audio.duration||100)*100)+'%'};function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}function render(){const p=location.hash.slice(1).split('/');if(p[1]==='kit')detail(p[2]);else if(p[1]==='upload')upload();else if(p[1]==='producer')producer(p[2]||'NOVA');else if(p[1]==='dashboard')dashboard();else home()}window.onhashchange=render;render();
</script></body></html>
